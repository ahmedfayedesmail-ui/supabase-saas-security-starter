name: Deploy validation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static validation site
        shell: bash
        run: |
          mkdir -p site/a site/b
          cp landing/index-a.html site/a/index.html
          cp landing/index-b.html site/b/index.html
          cp landing/terms.html site/a/terms.html
          cp landing/privacy.html site/a/privacy.html
          cp landing/refund.html site/a/refund.html
          cp landing/terms.html site/b/terms.html
          cp landing/privacy.html site/b/privacy.html
          cp landing/refund.html site/b/refund.html
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width,initial-scale=1">
              <meta name="description" content="Validation-stage landing pages for a planned Supabase multi-tenant SaaS developer product.">
              <title>Supabase SaaS Security Starter — Validation</title>
              <style>
                :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#080c16;color:#eef2ff}
                body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#18213c 0,#080c16 55%)}
                main{width:min(760px,calc(100% - 40px));padding:40px 0}
                h1{font-size:clamp(38px,7vw,64px);line-height:1.03;letter-spacing:-2px;margin:0 0 14px}
                p{color:#aab4cc;font-size:18px;line-height:1.6}
                .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
                a{display:block;padding:18px;border:1px solid #27324a;border-radius:14px;background:#10182a;color:#eef2ff;text-decoration:none;font-weight:750}
                a:hover{border-color:#7f96ff;transform:translateY(-1px)}
                small{display:block;color:#7e8aa5;margin-top:6px;font-weight:500}
                @media(max-width:640px){.grid{grid-template-columns:1fr}}
              </style>
            </head>
            <body>
              <main>
                <div>Validation-stage Early Access</div>
                <h1>Supabase SaaS Security Starter</h1>
                <p>This public site contains two controlled positioning variants for paid validation of a planned multi-tenant SaaS starter.</p>
                <div class="grid">
                  <a href="./a/">Landing A — Speed<small>Faster SaaS foundation setup</small></a>
                  <a href="./b/">Landing B — Security<small>Tenant-isolation verification</small></a>
                </div>
              </main>
            </body>
          </html>
          EOF
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
