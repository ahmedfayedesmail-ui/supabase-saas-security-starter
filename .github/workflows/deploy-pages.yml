name: Deploy validation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static validation site
        shell: bash
        run: |
          mkdir -p site/a site/b
          cp landing/index.html site/index.html
          cp landing/index-a.html site/a/index.html
          cp landing/index-b.html site/b/index.html
          cp landing/terms.html site/a/terms.html
          cp landing/privacy.html site/a/privacy.html
          cp landing/refund.html site/a/refund.html
          cp landing/terms.html site/b/terms.html
          cp landing/privacy.html site/b/privacy.html
          cp landing/refund.html site/b/refund.html
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
