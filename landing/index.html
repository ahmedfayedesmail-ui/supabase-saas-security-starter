<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting…</title>
</head>
<body>
  <p>Redirecting to your validation variant…</p>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const explicit = (params.get('utm_content') || '').toLowerCase();
      let variant = explicit.includes('landing_b') ? 'B' : explicit.includes('landing_a') ? 'A' : null;

      try {
        if (!variant) variant = localStorage.getItem('saas_validation_variant');
        if (!variant) {
          variant = Math.random() < 0.5 ? 'A' : 'B';
          localStorage.setItem('saas_validation_variant', variant);
        }
      } catch {
        variant = variant || (Math.random() < 0.5 ? 'A' : 'B');
      }

      if (variant !== 'A' && variant !== 'B') variant = 'A';
      if (variant === 'A' || variant === 'B') {
        if (!explicit.includes('landing_a') && !explicit.includes('landing_b')) {
          params.set('utm_content', `landing_${variant.toLowerCase()}`);
        }
      }

      const suffix = params.toString() ? `?${params.toString()}` : '';
      location.replace(`./${variant.toLowerCase()}/${suffix}`);
    })();
  </script>
</body>
</html>
